# Proxy Pusher/Reverb protocol to the Reverb process in the same container (port 8080).
<IfModule mod_proxy.c>
    ProxyRequests Off
    ProxyPreserveHost On

    # WebSocket + HTTP for client connections (/app/{key})
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule ^/app/(.*)$ ws://127.0.0.1:8080/app/$1 [P,L]
    RewriteCond %{HTTP:Upgrade} !=websocket [NC]
    RewriteRule ^/app/(.*)$ http://127.0.0.1:8080/app/$1 [P,L]

    # HTTP API for Laravel broadcast() (/apps/{id}/events, etc.)
    ProxyPass /apps/ http://127.0.0.1:8080/apps/
    ProxyPassReverse /apps/ http://127.0.0.1:8080/apps/
</IfModule>