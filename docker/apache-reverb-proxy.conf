# Proxy WebSocket /app/* (Pusher/Reverb protocol) to the Reverb process in the same container.
<IfModule mod_proxy.c>
    ProxyRequests Off
    ProxyPreserveHost On

    <Location /app/>
        ProxyPass ws://127.0.0.1:8080/app/
        ProxyPassReverse ws://127.0.0.1:8080/app/
    </Location>
</IfModule>