<VirtualHost *:80>
    ServerName apiamis.cianjur.space
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ProxyRequests Off
    ProxyPreserveHost On

    # Laravel broadcast HTTP API
    ProxyPass /apps/ http://127.0.0.1:8080/apps/
    ProxyPassReverse /apps/ http://127.0.0.1:8080/apps/

    # Reverb WebSocket + HTTP (/app/{key})
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} =websocket [NC,OR]
    RewriteCond %{HTTP:Upgrade} =WebSocket [NC]
    RewriteRule ^/app/(.*)$ ws://127.0.0.1:8080/app/$1 [P,L]
    RewriteRule ^/app/(.*)$ http://127.0.0.1:8080/app/$1 [P,L]

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>