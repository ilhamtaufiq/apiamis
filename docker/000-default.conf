<VirtualHost *:80>
    ServerName apiamis.cianjur.space
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Fase A: sajikan foto langsung dari Apache tanpa lewat Laravel.
    # URL /storage/{media_id}/{file} dipetakan ke storage/app/public.
    # Tidak bergantung pada symlink public/storage (php artisan storage:link).
    Alias /storage /var/www/html/storage/app/public

    <Directory /var/www/html/storage/app/public>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    # Fase C (OPSIONAL, sengaja nonaktif): reverse proxy /api ke Rust API di 127.0.0.1:8000.
    # Aktifkan HANYA di staging, dan hanya setelah parity check Fase B lolos.
    # Syarat: jalankan `a2enmod proxy proxy_http` terlebih dahulu.
    # Alias /storage harus tetap berada di depan blok ini agar tidak tertelan oleh proxy.
    # Prefix /api tidak cocok dengan /storage, jadi routing foto tidak berubah.
    #ProxyPass /api http://127.0.0.1:8000/api
    #ProxyPassReverse /api http://127.0.0.1:8000/api

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
