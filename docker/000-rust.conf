<VirtualHost *:80>
    ServerName apiamis.cianjur.space
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>

    # Foto dan berkas langsung dari disk, tanpa Laravel.
    Alias /storage /var/www/html/storage/app/public
    <Directory /var/www/html/storage/app/public>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    # Semua permintaan selain /storage ke binary Rust: /api, /up, dan / (info layanan).
    # Header CORS diatur di Rust (cors_layer).
    ProxyPreserveHost On
    ProxyPass /storage !
    ProxyPass /api http://127.0.0.1:8000/api
    ProxyPassReverse /api http://127.0.0.1:8000/api
    ProxyPass /up http://127.0.0.1:8000/up
    ProxyPassReverse /up http://127.0.0.1:8000/up
    ProxyPass / http://127.0.0.1:8000/
    ProxyPassReverse / http://127.0.0.1:8000/

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
