[workspace]
resolver = "2"
members = ["crates/api", "crates/auth", "crates/shared"]

[workspace.package]
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
axum = "0.8"
auth = { path = "crates/auth" }
dotenvy = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
subtle = "2"
shared = { path = "crates/shared" }
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "limit", "request-id", "timeout", "trace", "uuid"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
