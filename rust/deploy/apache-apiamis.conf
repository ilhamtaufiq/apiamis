# Contoh vhost Apache untuk apiamis.test: endpoint yang sudah dipindah ke Rust
# (port 8000) diteruskan, sisanya tetap ke Laravel (public/index.php).
# Modul yang dibutuhkan: mod_rewrite, mod_proxy, mod_proxy_http.

<VirtualHost *:80>
    ServerName apiamis.test
    DocumentRoot "C:/laragon/www/arumanis-hq/apiamis/public"

    <Directory "C:/laragon/www/arumanis-hq/apiamis/public">
        AllowOverride All
        Require all granted
    </Directory>

    ProxyPreserveHost On
    ProxyTimeout 60

    RewriteEngine On

    # Health check
    RewriteCond %{REQUEST_METHOD} =GET
    RewriteRule ^/(up|api/health)$ http://127.0.0.1:8000/$1 [P,L]

    # Sesi: me, logout, dan sync-token (pengganti BFF)
    RewriteCond %{REQUEST_METHOD} =GET
    RewriteRule ^/api/auth/me$ http://127.0.0.1:8000/api/auth/me [P,L]

    RewriteCond %{REQUEST_METHOD} =GET
    RewriteRule ^/api/user$ http://127.0.0.1:8000/api/user [P,L]

    RewriteCond %{REQUEST_METHOD} =POST
    RewriteRule ^/api/auth/(login|logout|sync-token|handoff|handoff/exchange)$ http://127.0.0.1:8000/api/auth/$1 [P,L]

    # Google OAuth: redirect dan callback (GET).
    RewriteCond %{REQUEST_METHOD} =GET
    RewriteRule ^/api/auth/(google|google/callback)$ http://127.0.0.1:8000/api/auth/$1 [P,L]

    # App settings: mail-templates dan Google Drive tetap di Laravel (diteruskan ke index.php).
    RewriteRule ^/api/app-settings/(mail-templates|backups/google-drive(/.*)?)$ index.php [L]

    # App settings: simpan dan hapus backup lokal (.zip) sudah di Rust.
    RewriteCond %{REQUEST_METHOD} =POST
    RewriteRule ^/api/app-settings$ http://127.0.0.1:8000/api/app-settings [P,L]

    RewriteCond %{REQUEST_METHOD} =DELETE
    RewriteRule ^/api/app-settings/backups/([^/]+\.zip)$ http://127.0.0.1:8000/api/app-settings/backups/$1 [P,L]

    # Unit SPAM (spam-units). Import CSV belum dipindah (tetap di Laravel).
    RewriteRule ^/api/public/spam-units/(stats|map-stats|map-stats/series)$ http://127.0.0.1:8000/api/public/spam-units/$1 [P,L]
    RewriteRule ^/api/spam-units/(stats|stats/series|integration|integration/output-options|integration/desa/[0-9]+|air-minum-pekerjaan)$ http://127.0.0.1:8000/api/spam-units/$1 [P,L]
    RewriteRule ^/api/spam-units((?:/[0-9]+(?:/(?:pekerjaan(?:/[0-9]+)?|sync-pekerjaan|achievements|budgets(?:/[0-9]+)?))?)?)$ http://127.0.0.1:8000/api/spam-units$1 [P,L]

    # SPM sanitasi: statistik, capaian, daftar, dan tulis. Show dan integrasi tetap di Laravel.
    RewriteCond %{REQUEST_METHOD} =GET
    RewriteRule ^/api/(public/spm-sanitasi/stats|public/spm-sanitasi/map-stats|spm-sanitasi/stats|spm-sanitasi/capaian|spm-sanitasi)$ http://127.0.0.1:8000/api/$1 [P,L]

    RewriteCond %{REQUEST_METHOD} =POST
    RewriteRule ^/api/(spm-sanitasi)$ http://127.0.0.1:8000/api/$1 [P,L]

    RewriteCond %{REQUEST_METHOD} ^(PUT|PATCH|DELETE)$
    RewriteRule ^/api/(spm-sanitasi/[0-9]+)$ http://127.0.0.1:8000/api/$1 [P,L]

    # Blog: baca publik dan komentar.
    RewriteCond %{REQUEST_METHOD} =GET
    RewriteRule ^/api/(blog|blog/comments|blog/[^/]+|blog/[^/]+/comments|blog/[^/]+/comments/count|blog/[^/]+/comments/thread/[0-9]+)$ http://127.0.0.1:8000/api/$1 [P,L]

    # Blog: tulis, fitur utama, dan unggah video.
    RewriteCond %{REQUEST_METHOD} =POST
    RewriteRule ^/api/(blog|blog/upload-video|blog/[^/]+/comments|blog/[^/]+/feature)$ http://127.0.0.1:8000/api/$1 [P,L]

    RewriteCond %{REQUEST_METHOD} ^(PUT|PATCH)$
    RewriteRule ^/api/(blog/[^/]+|blog/comments/[0-9]+)$ http://127.0.0.1:8000/api/$1 [P,L]

    RewriteCond %{REQUEST_METHOD} =DELETE
    RewriteRule ^/api/(blog/[^/]+|blog/comments/[0-9]+|blog/[^/]+/feature)$ http://127.0.0.1:8000/api/$1 [P,L]

    # Pekerjaan: tambah dan impor (POST), sudah di Rust.
    RewriteCond %{REQUEST_METHOD} =POST
    RewriteRule ^/api/(pekerjaan|pekerjaan/import)$ http://127.0.0.1:8000/api/$1 [P,L]

    # Pekerjaan: hapus (DELETE) dan progress estimasi (PUT), sudah di Rust.
    RewriteCond %{REQUEST_METHOD} =DELETE
    RewriteRule ^/api/(pekerjaan/[0-9]+)$ http://127.0.0.1:8000/api/$1 [P,L]

    RewriteCond %{REQUEST_METHOD} =PUT
    RewriteRule ^/api/(pekerjaan/[0-9]+/progress-estimasi)$ http://127.0.0.1:8000/api/$1 [P,L]

    # Izin (permissions): daftar, detail, buat, ubah (PUT/PATCH), dan hapus.
    RewriteCond %{REQUEST_METHOD} =GET
    RewriteRule ^/api/(permissions|permissions/[0-9]+)$ http://127.0.0.1:8000/api/$1 [P,L]

    RewriteCond %{REQUEST_METHOD} =POST
    RewriteRule ^/api/(permissions)$ http://127.0.0.1:8000/api/$1 [P,L]

    RewriteCond %{REQUEST_METHOD} ^(PUT|PATCH|DELETE)$
    RewriteRule ^/api/(permissions/[0-9]+)$ http://127.0.0.1:8000/api/$1 [P,L]

    # GET endpoint yang sudah dipindah (lihat docs/migration/routes.md)
    RewriteCond %{REQUEST_METHOD} =GET
    RewriteRule ^/api/(kecamatan|desa|kegiatan|kegiatan-role|pengawas|users|penyedia|tags|document-types|app-settings|tiket|checklist-items|pekerjaan-checklist|post-pekerjaan-checklist|pekerjaan|user-pekerjaan)(/.*)?$ http://127.0.0.1:8000/api/$1$2 [P,L]

    # Update pekerjaan (PUT/PATCH) sudah di Rust
    RewriteCond %{REQUEST_METHOD} ^(PUT|PATCH)$
    RewriteRule ^/api/(pekerjaan/[0-9]+)$ http://127.0.0.1:8000/api/$1 [P,L]

    # Tags: POST create, PUT/PATCH/DELETE per id, sudah di Rust
    RewriteCond %{REQUEST_METHOD} =POST
    RewriteRule ^/api/tags$ http://127.0.0.1:8000/api/tags [P,L]

    RewriteCond %{REQUEST_METHOD} ^(PUT|PATCH|DELETE)$
    RewriteRule ^/api/(tags/[0-9]+)$ http://127.0.0.1:8000/api/$1 [P,L]

    # Output: seluruh rute sudah di Rust.
    RewriteCond %{REQUEST_METHOD} =GET
    RewriteRule ^/api/(output|output/summary|output/[0-9]+)$ http://127.0.0.1:8000/api/$1 [P,L]

    RewriteCond %{REQUEST_METHOD} =POST
    RewriteRule ^/api/output$ http://127.0.0.1:8000/api/output [P,L]

    RewriteCond %{REQUEST_METHOD} ^(PUT|PATCH|DELETE)$
    RewriteRule ^/api/(output/[0-9]+)$ http://127.0.0.1:8000/api/$1 [P,L]

    # Draft pekerjaan: kecuali export Excel, yang masih di Laravel.
    RewriteCond %{REQUEST_METHOD} =GET
    RewriteRule ^/api/(draft-pekerjaan|draft-pekerjaan/[0-9]+)$ http://127.0.0.1:8000/api/$1 [P,L]

    RewriteCond %{REQUEST_METHOD} =POST
    RewriteRule ^/api/draft-pekerjaan$ http://127.0.0.1:8000/api/draft-pekerjaan [P,L]

    RewriteCond %{REQUEST_METHOD} ^(PUT|PATCH|DELETE)$
    RewriteRule ^/api/(draft-pekerjaan/[0-9]+)$ http://127.0.0.1:8000/api/$1 [P,L]

    # Penerima: seluruh rute sudah di Rust.
    RewriteCond %{REQUEST_METHOD} =GET
    RewriteRule ^/api/(penerima|penerima/summary|penerima/rekap|penerima/pekerjaan/[0-9]+|penerima/pekerjaan/[0-9]+/stats/komunal|penerima/[0-9]+)$ http://127.0.0.1:8000/api/$1 [P,L]

    RewriteCond %{REQUEST_METHOD} =POST
    RewriteRule ^/api/penerima$ http://127.0.0.1:8000/api/penerima [P,L]

    RewriteCond %{REQUEST_METHOD} ^(PUT|PATCH|DELETE)$
    RewriteRule ^/api/(penerima/[0-9]+)$ http://127.0.0.1:8000/api/$1 [P,L]

    # Konversi PDF lewat ONLYOFFICE: export-pdf berkas, dan unduhan berkas untuk Document Server (publik, bertoken).
    # Berkas sementara SPK/cover/BAP juga diunduh Document Server lewat onlyoffice/temp.
    RewriteCond %{REQUEST_METHOD} =GET
    RewriteRule ^/api/(berkas/[0-9]+/export-pdf|onlyoffice/media/[0-9]+/download|onlyoffice/temp/[0-9a-f]{32}\.docx)$ http://127.0.0.1:8000/api/$1 [P,L]

    # ONLYOFFICE editor (callback dari Document Server, health, dan config media).
    RewriteCond %{REQUEST_METHOD} =POST
    RewriteRule ^/api/(onlyoffice/callback)$ http://127.0.0.1:8000/api/$1 [P,L]

    RewriteCond %{REQUEST_METHOD} =GET
    RewriteRule ^/api/(onlyoffice/health|onlyoffice/media/[0-9]+/config)$ http://127.0.0.1:8000/api/$1 [P,L]

    # Upload berkas dari URL, export draft Excel, data quality, dan laporan error klien.
    RewriteCond %{REQUEST_METHOD} =POST
    RewriteRule ^/api/(berkas/upload-from-url|client-error-reports)$ http://127.0.0.1:8000/api/$1 [P,L]

    RewriteCond %{REQUEST_METHOD} =GET
    RewriteRule ^/api/(draft-pekerjaan/export/excel|data-quality/stats|data-quality/items|data-quality/action-inbox)$ http://127.0.0.1:8000/api/$1 [P,L]

    # Dashboard (statistik, analitik, executive progress) dan pencarian global.
    RewriteCond %{REQUEST_METHOD} =GET
    RewriteRule ^/api/(dashboard/stats|dashboard/analytics|dashboard/executive-progress|search)$ http://127.0.0.1:8000/api/$1 [P,L]

    # Procurement SPSE (kecuali kontrak/push, tetap di Laravel).
    RewriteRule ^/api/procurement/spse/(status|session|sync|sync/runs|staging|staging/[0-9]+|staging/(apply|map|promote-draft)|packages/[^/]+/documents|packages/(import-documents|download-zip))$ http://127.0.0.1:8000/api/procurement/spse/$1 [P,L]

    # Kontrak: CRUD, relasi pekerjaan/kegiatan/penyedia, excel export, template, impor, dan dokumen (SPK, cover, ZIP cover, BAP, bap-context). Addendum sudah di Rust; notify-pengawas masih di Laravel.
    RewriteCond %{REQUEST_METHOD} =GET
    RewriteRule ^/api/(kontrak|kontrak/[0-9]+|kontrak/(pekerjaan|kegiatan|penyedia)/[0-9]+|kontrak/export/excel|kontrak/import/template|kontrak/export-all-covers|kontrak/[0-9]+/(export|export-cover|bap-context|export-bap))$ http://127.0.0.1:8000/api/$1 [P,L]

    RewriteCond %{REQUEST_METHOD} =POST
    RewriteRule ^/api/(kontrak|kontrak/import)$ http://127.0.0.1:8000/api/$1 [P,L]

    RewriteCond %{REQUEST_METHOD} ^(PUT|PATCH|DELETE)$
    RewriteRule ^/api/(kontrak/[0-9]+)$ http://127.0.0.1:8000/api/$1 [P,L]

    # Berita acara (nomor urut per tahun) dan log audit (admin).
    RewriteCond %{REQUEST_METHOD} =GET
    RewriteRule ^/api/(berita-acara/sequence|audit-logs|audit-logs/[0-9]+)$ http://127.0.0.1:8000/api/$1 [P,L]

    RewriteCond %{REQUEST_METHOD} =POST
    RewriteRule ^/api/(berita-acara/sequence)$ http://127.0.0.1:8000/api/$1 [P,L]

    # Peran (admin): daftar, detail, buat, ubah (PUT/PATCH), dan hapus.
    RewriteCond %{REQUEST_METHOD} =GET
    RewriteRule ^/api/(roles|roles/[0-9]+)$ http://127.0.0.1:8000/api/$1 [P,L]

    RewriteCond %{REQUEST_METHOD} =POST
    RewriteRule ^/api/(roles)$ http://127.0.0.1:8000/api/$1 [P,L]

    RewriteCond %{REQUEST_METHOD} ^(PUT|PATCH|DELETE)$
    RewriteRule ^/api/(roles/[0-9]+)$ http://127.0.0.1:8000/api/$1 [P,L]

    # Tautan SIPD, pustaka tanda tangan, peta peripaan, dan register dokumen.
    RewriteCond %{REQUEST_METHOD} =GET
    RewriteRule ^/api/(sipd-pekerjaan-links|signature-libraries|peripaan|document-registers)$ http://127.0.0.1:8000/api/$1 [P,L]

    RewriteCond %{REQUEST_METHOD} =POST
    RewriteRule ^/api/(signature-libraries|peripaan|document-registers)$ http://127.0.0.1:8000/api/$1 [P,L]

    RewriteCond %{REQUEST_METHOD} =PUT
    RewriteRule ^/api/(sipd-pekerjaan-links)$ http://127.0.0.1:8000/api/$1 [P,L]

    RewriteCond %{REQUEST_METHOD} ^(PUT|PATCH|DELETE)$
    RewriteRule ^/api/(document-registers/[0-9]+)$ http://127.0.0.1:8000/api/$1 [P,L]

    RewriteCond %{REQUEST_METHOD} =DELETE
    RewriteRule ^/api/(sipd-pekerjaan-links|signature-libraries/[0-9]+|peripaan/[0-9]+)$ http://127.0.0.1:8000/api/$1 [P,L]

    # Master fase pekerjaan: daftar, detail, buat, ubah (PUT/PATCH), dan hapus.
    RewriteCond %{REQUEST_METHOD} =GET
    RewriteRule ^/api/(master-fase-pekerjaan|master-fase-pekerjaan/[0-9]+)$ http://127.0.0.1:8000/api/$1 [P,L]

    RewriteCond %{REQUEST_METHOD} =POST
    RewriteRule ^/api/(master-fase-pekerjaan)$ http://127.0.0.1:8000/api/$1 [P,L]

    RewriteCond %{REQUEST_METHOD} ^(PUT|PATCH|DELETE)$
    RewriteRule ^/api/(master-fase-pekerjaan/[0-9]+)$ http://127.0.0.1:8000/api/$1 [P,L]

    # SK (admin): CRUD termasuk POST dengan _method=PUT.
    RewriteCond %{REQUEST_METHOD} =GET
    RewriteRule ^/api/(sk|sk/[0-9]+)$ http://127.0.0.1:8000/api/$1 [P,L]

    RewriteCond %{REQUEST_METHOD} =POST
    RewriteRule ^/api/(sk|sk/[0-9]+)$ http://127.0.0.1:8000/api/$1 [P,L]

    RewriteCond %{REQUEST_METHOD} ^(PUT|PATCH|DELETE)$
    RewriteRule ^/api/(sk/[0-9]+)$ http://127.0.0.1:8000/api/$1 [P,L]

    # Notifikasi: daftar, tandai dibaca, dan broadcast (admin).
    RewriteCond %{REQUEST_METHOD} =GET
    RewriteRule ^/api/(notifications|notifications/broadcast-history)$ http://127.0.0.1:8000/api/$1 [P,L]

    RewriteCond %{REQUEST_METHOD} =POST
    RewriteRule ^/api/(notifications/[0-9]+/read|notifications/mark-all-read|notifications/broadcast)$ http://127.0.0.1:8000/api/$1 [P,L]

    RewriteCond %{REQUEST_METHOD} =DELETE
    RewriteRule ^/api/(notifications/broadcast/[0-9]+)$ http://127.0.0.1:8000/api/$1 [P,L]

    # Addendum kontrak: daftar, detail, buat, ubah, hapus, alur persetujuan, nomor, dan upload.
    # register-gaps (GET) sudah di Rust; notify-pengawas masih di Laravel karena mengirim email.
    RewriteCond %{REQUEST_METHOD} =GET
    RewriteRule ^/api/(kontrak-addendums|kontrak-addendums/[0-9]+|kontrak-addendums/register-gaps|kontrak/[0-9]+/addendums|kontrak/[0-9]+/addendum-register-gaps)$ http://127.0.0.1:8000/api/$1 [P,L]

    RewriteCond %{REQUEST_METHOD} =POST
    RewriteRule ^/api/(kontrak/[0-9]+/addendums|kontrak/[0-9]+/addendum-numbers|kontrak-addendums/[0-9]+/(submit|process|approve|override-kelengkapan|reject|upload))$ http://127.0.0.1:8000/api/$1 [P,L]

    RewriteCond %{REQUEST_METHOD} ^(PUT|DELETE)$
    RewriteRule ^/api/(kontrak-addendums/[0-9]+)$ http://127.0.0.1:8000/api/$1 [P,L]

    RewriteCond %{REQUEST_METHOD} =PUT
    RewriteRule ^/api/(kontrak-addendums/[0-9]+/attachment-numbers)$ http://127.0.0.1:8000/api/$1 [P,L]

    # Kecamatan, desa, penyedia, kegiatan, pengawas, dan users: tulis sudah di Rust. desa profile menunggu keputusan (lihat log migrasi) dan sync-kk masih di Laravel.
    RewriteCond %{REQUEST_METHOD} =POST
    RewriteRule ^/api/(kecamatan|desa|penyedia|kegiatan|kegiatan-role|pengawas|users)$ http://127.0.0.1:8000/api/$1 [P,L]

    # Penyedia: update multipart dari frontend memakai POST dengan _method=PUT.
    RewriteCond %{REQUEST_METHOD} =POST
    RewriteRule ^/api/(penyedia/[0-9]+)$ http://127.0.0.1:8000/api/$1 [P,L]

    RewriteCond %{REQUEST_METHOD} ^(PUT|PATCH|DELETE)$
    RewriteRule ^/api/((kecamatan|desa|penyedia|kegiatan|pengawas|users)/[0-9]+)$ http://127.0.0.1:8000/api/$1 [P,L]

    # Koordinat dan progres: validasi koordinat, laporan progres (GET), dan simpan progres (POST).
    RewriteCond %{REQUEST_METHOD} =POST
    RewriteRule ^/api/(koordinat/validate|progress/pekerjaan/[0-9]+)$ http://127.0.0.1:8000/api/$1 [P,L]

    RewriteCond %{REQUEST_METHOD} =GET
    RewriteRule ^/api/(progress/pekerjaan/[0-9]+)$ http://127.0.0.1:8000/api/$1 [P,L]

    RewriteCond %{REQUEST_METHOD} =DELETE
    RewriteRule ^/api/(kegiatan-role/[0-9]+)$ http://127.0.0.1:8000/api/$1 [P,L]

    # User-pekerjaan (admin): tambah (POST) dan hapus (DELETE). Sudah di Rust.
    RewriteCond %{REQUEST_METHOD} =POST
    RewriteRule ^/api/(user-pekerjaan)$ http://127.0.0.1:8000/api/$1 [P,L]

    RewriteCond %{REQUEST_METHOD} =DELETE
    RewriteRule ^/api/(user-pekerjaan/[0-9]+)$ http://127.0.0.1:8000/api/$1 [P,L]

    # Berkas: daftar, jenis dokumen, tampil, simpan, ubah, hapus, dan bulk.
    # export-pdf, upload-from-url, dan quick-share masih di Laravel.
    RewriteCond %{REQUEST_METHOD} =GET
    RewriteRule ^/api/(berkas|berkas/jenis-dokumen|berkas/[0-9]+)$ http://127.0.0.1:8000/api/$1 [P,L]

    RewriteCond %{REQUEST_METHOD} =POST
    RewriteRule ^/api/(berkas|berkas/[0-9]+)$ http://127.0.0.1:8000/api/$1 [P,L]

    RewriteCond %{REQUEST_METHOD} ^(PUT|PATCH|DELETE)$
    RewriteRule ^/api/(berkas/[0-9]+)$ http://127.0.0.1:8000/api/$1 [P,L]

    RewriteCond %{REQUEST_METHOD} =DELETE
    RewriteRule ^/api/(berkas/bulk)$ http://127.0.0.1:8000/api/$1 [P,L]

    # Foto: daftar, tampil, simpan, ubah (PUT/PATCH, atau POST dengan _method=PUT), hapus.
    RewriteCond %{REQUEST_METHOD} =GET
    RewriteRule ^/api/(foto|foto/[0-9]+)$ http://127.0.0.1:8000/api/$1 [P,L]

    RewriteCond %{REQUEST_METHOD} =POST
    RewriteRule ^/api/(foto|foto/[0-9]+)$ http://127.0.0.1:8000/api/$1 [P,L]

    RewriteCond %{REQUEST_METHOD} ^(PUT|PATCH|DELETE)$
    RewriteRule ^/api/(foto/[0-9]+)$ http://127.0.0.1:8000/api/$1 [P,L]

    RewriteCond %{REQUEST_METHOD} =DELETE
    RewriteRule ^/api/(foto/bulk)$ http://127.0.0.1:8000/api/$1 [P,L]

    # Fallback: sisa request ke Laravel (public/index.php)
    RewriteCond %{REQUEST_FILENAME} !-f
    RewriteCond %{REQUEST_FILENAME} !-d
    RewriteRule ^ index.php [L]
</VirtualHost>
