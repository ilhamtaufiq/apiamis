name: rust

on:
  push:
    branches: [rust, main]
    paths:
      - "rust/**"
      - ".github/workflows/rust.yml"
  pull_request:
    paths:
      - "rust/**"
      - ".github/workflows/rust.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace

  integration:
    runs-on: ubuntu-latest
    needs: check
    defaults:
      run:
        working-directory: rust
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: apiamis
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ptest"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DATABASE_URL: mysql://root:test@127.0.0.1:3306/apiamis
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: load skema auth, kecamatan, permission, maintenance, dan login (struktur saja)
        run: |
          mysql -h127.0.0.1 -uroot -ptest apiamis < fixtures/auth_schema.sql
          mysql -h127.0.0.1 -uroot -ptest apiamis < fixtures/kecamatan_schema.sql
          mysql -h127.0.0.1 -uroot -ptest apiamis < fixtures/permission_schema.sql
          mysql -h127.0.0.1 -uroot -ptest apiamis < fixtures/maintenance_schema.sql
          mysql -h127.0.0.1 -uroot -ptest apiamis < fixtures/login_schema.sql
      - name: test integrasi auth
        run: cargo test -p auth --test db_lookup -- --ignored
      - name: test integrasi kecamatan
        run: cargo test -p api --test kecamatan_db -- --ignored
      - name: test integrasi permission
        run: cargo test -p auth --test permission_db -- --ignored
      - name: test integrasi route dan maintenance
        run: cargo test -p api --test routes_db -- --ignored
      - name: test integrasi login
        run: cargo test -p api --test login_db -- --ignored
